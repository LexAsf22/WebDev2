<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Car Inventory</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Automotive Theme Extras */
    body {
      background: radial-gradient(circle at top, #1b1b1b, #0d0d0d);
      color: #e2e8f0;
      font-family: 'Roboto', sans-serif;
    }

    .dashboard-card {
      background: linear-gradient(145deg, #1f1f1f, #0e0e0e);
      border: 1px solid #2c2c2c;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .input-field {
      background-color: #1a1a1a;
      border: 1px solid #333;
      color: #e2e8f0;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-field:focus {
      border-color: #ff1e1e;
      box-shadow: 0 0 8px #ff1e1e33;
      outline: none;
    }

    .red-btn {
      background: linear-gradient(90deg, #ff1e1e, #c80000);
      color: white;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .red-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 0 12px #ff1e1e66;
    }

    .glass {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    table th {
      background-color: #222;
      color: #ff3b3b;
      text-transform: uppercase;
    }

    table td {
      background-color: #111;
      color: #ddd;
    }

    table tr:hover td {
      background-color: #1b1b1b;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center p-8">

  <!-- LOGIN SECTION -->
  <div id="loginSection" class="mt-10 dashboard-card w-80 mx-auto p-6 rounded-xl text-center">
    <h2 class="text-red-500 mb-4 text-xl font-bold">Login</h2>
    <input class="input-field w-full p-2 mb-2 rounded-md" type="text" id="username" placeholder="Username">
    <input class="input-field w-full p-2 mb-4 rounded-md" type="password" id="password" placeholder="Password">
    <button class="red-btn px-4 py-2 rounded-md w-full" id="loginBtn">Login</button>

    <p class="text-sm text-gray-400 mt-3">Don't have an account?
      <button onclick="toggleRegister()" class="text-red-500 underline">Register</button>
    </p>
  </div>

  <!-- REGISTER SECTION -->
  <div id="registerSection" class="hidden mt-10 dashboard-card w-80 mx-auto p-6 rounded-xl text-center">
    <h2 class="text-red-500 mb-4 text-xl font-bold">Register</h2>
    <input class="input-field w-full p-2 mb-2 rounded-md" type="text" id="regUsername" placeholder="Username" required>
    <input class="input-field w-full p-2 mb-2 rounded-md" type="password" id="regPassword" placeholder="Password" required>
    <input class="input-field w-full p-2 mb-4 rounded-md" type="password" id="confirmPassword" placeholder="Confirm Password" required>
    <button class="red-btn px-4 py-2 rounded-md w-full mb-3" id="registerBtn">Register</button>

    <p class="text-sm text-gray-400">Already have an account?
      <button onclick="toggleLogin()" class="text-red-500 underline">Login</button>
    </p>
  </div>

  <!-- CRUD SECTION -->
  <div id="crudSection" class="hidden w-full max-w-6xl dashboard-card rounded-lg p-6 mt-10">
    <div class="flex justify-between items-center mb-4 border-b border-gray-700 pb-3">
      <h1 class="text-2xl text-red-500 font-bold">Car Management</h1>
      <div class="flex gap-2">
        <button onclick="openCreateModal()" class="red-btn px-4 py-2 rounded-md">Add New Car</button>
        <button onclick="logout()" class="bg-gray-700 px-4 py-2 rounded-md text-white hover:bg-gray-800">Logout</button>
      </div>
    </div>

    <table class="w-full border-collapse rounded-lg overflow-hidden">
      <thead>
        <tr>
          <th class="p-2 border border-gray-700">ID</th>
          <th class="p-2 border border-gray-700">License Plate</th>
          <th class="p-2 border border-gray-700">Make</th>
          <th class="p-2 border border-gray-700">Model</th>
          <th class="p-2 border border-gray-700">Year</th>
          <th class="p-2 border border-gray-700">Color</th>
          <th class="p-2 border border-gray-700">Body Type</th>
          <th class="p-2 border border-gray-700">Engine Type</th>
          <th class="p-2 border border-gray-700">Transmission</th>
          <th class="p-2 border border-gray-700">Actions</th>
        </tr>
      </thead>
      <tbody id="carTableBody"></tbody>
    </table>
  </div>

  <!-- MODAL -->
  <div id="carModal" class="hidden fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center">
    <div class="dashboard-card rounded-lg w-96 p-6">
      <h2 id="modalTitle" class="text-xl text-red-500 font-semibold mb-4"></h2>
      <form id="carForm" onsubmit="saveCar(event)">
        <input type="hidden" id="carId">
        <div class="mb-2">
          <label class="block text-gray-300">License Plate</label>
          <input id="carLicensePlateNumber" class="input-field p-2 w-full rounded" required>
        </div>
        <div class="mb-2">
          <label class="block text-gray-300">Make</label>
          <input id="carMake" class="input-field p-2 w-full rounded" required>
        </div>
        <div class="mb-2">
          <label class="block text-gray-300">Model</label>
          <input id="carModel" class="input-field p-2 w-full rounded" required>
        </div>
        <div class="mb-2">
          <label class="block text-gray-300">Year</label>
          <input id="carYear" type="number" class="input-field p-2 w-full rounded" required>
        </div>
        <div class="mb-2">
          <label class="block text-gray-300">Color</label>
          <input id="carColor" class="input-field p-2 w-full rounded" required>
        </div>
        <div class="mb-2">
          <label class="block text-gray-300">Body Type</label>
          <input id="carBodyType" class="input-field p-2 w-full rounded" required>
        </div>
        <div class="mb-2">
          <label class="block text-gray-300">Engine Type</label>
          <input id="carEngineType" class="input-field p-2 w-full rounded" required>
        </div>
        <div class="mb-2">
          <label class="block text-gray-300">Transmission</label>
          <input id="carTransmission" class="input-field p-2 w-full rounded" required>
        </div>
        <div class="flex justify-end mt-4 space-x-2">
          <button type="button" onclick="closeModal()" class="px-4 py-2 bg-gray-600 text-white rounded hover:bg-gray-700">Cancel</button>
          <button type="submit" class="red-btn px-4 py-2 rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
